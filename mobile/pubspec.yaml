name: civicpulse_mobile
description: "CivicPulse AI — Multilingual Citizen Civic Grievance Reporting App for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  http: ^1.2.0
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  speech_to_text: ^6.6.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
